[project]
name = "telecom-ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "openai>=3.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

# =============================================================================
# PyTorch source override — CPU-only wheel for Linux/Docker builds.
# This prevents uv from resolving the ~2.5GB CUDA build on non-GPU machines.
# On macOS, uv uses the default PyPI index (MPS-compatible wheel).
# For GPU cloud (GKE/ECS with NVIDIA), change "cpu" to "cu121" or "cu124".
# =============================================================================
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI standard pattern)
    "BLE001", # Do not catch blind exception `Exception` (Required for resilient LLM/HTTP fallback)
    "E501",   # Line too long
]
